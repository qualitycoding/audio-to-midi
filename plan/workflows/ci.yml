# Installed to .github/workflows/ci.yml by S-001 (D-005)
name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: '0 6 * * 1' }]
permissions: { contents: read, issues: write }
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.2', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run verify:freeze          # T-034
      - run: npm run audit                  # T-016
      - run: npx tsc --noEmit
      - run: npm test                       # T-001..T-012, T-014, T-015, T-031
      - run: npm run test:accuracy          # T-013
  e2e:
    needs: unit
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { project: [chromium, firefox, webkit, mobile-chromium, mobile-webkit] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci && npm run fixtures
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --project=${{ matrix.project }}   # T-020..T-027, T-030
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-${{ matrix.project }}, path: playwright-report }
  perf:
    needs: unit
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { project: [desktop-perf, mobile-perf] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci && npm run fixtures
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}   # T-028 / T-029
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-${{ matrix.project }}, path: perf/results }
  prod-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/deploy/smoke.sh https://qualitycoding.github.io/audio-to-midi/ || gh issue create --title "Production smoke failed $(date -u +%F)" --body "See run $GITHUB_RUN_ID"
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
