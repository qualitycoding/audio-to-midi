<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- D-024 CSP: no unsafe-eval, no inline script. 'wasm-unsafe-eval' is required to instantiate TF.js's wasm backend. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>audio-to-midi</title>
  <link rel="stylesheet" href="/src/ui/app.css" />
</head>
<body>
  <main id="app">
    <header class="transport">
      <label class="file-picker">
        Load stems
        <input data-testid="file-input" type="file" accept="audio/*,.wav,.mp3,.ogg,.oga,.flac" multiple />
      </label>
      <button data-testid="play" type="button">&#9654; Play</button>
      <button data-testid="stop" type="button">&#9632; Stop</button>
      <button data-testid="zoom-in" type="button">Zoom +</button>
      <button data-testid="zoom-out" type="button">Zoom -</button>
      <button data-testid="zoom-fit" type="button">Fit</button>
      <label>A4 (Hz) <input data-testid="a4" type="number" min="400" max="480" step="1" value="440" /></label>
      <label>BPM <input data-testid="bpm" type="number" min="20" max="400" step="0.1" value="120" /></label>
      <label>Offset (s) <input data-testid="grid-offset" type="number" step="0.01" value="0" /></label>
      <label>Beats/bar <input data-testid="beats-per-bar" type="number" min="1" max="16" step="1" value="4" /></label>
      <label>Beat unit
        <select data-testid="beat-unit">
          <option value="2">2</option><option value="4" selected>4</option><option value="8">8</option>
        </select>
      </label>
      <button data-testid="export-midi" type="button">Export MIDI</button>
      <button data-testid="export-tab-txt" type="button">Export tab (.txt)</button>
      <button data-testid="export-musicxml" type="button">Export MusicXML</button>
    </header>
    <div role="alert" data-testid="alerts" aria-live="assertive"></div>
    <section data-testid="stems" class="stems"></section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
